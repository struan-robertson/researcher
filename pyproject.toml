[project]
name = "researcher"
version = "0.1.0"
description = "ML literature discovery with a persistent local paper library"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.29.0",
    "msgspec>=0.22.0",
    "platformdirs>=4.14.5",
]

[project.scripts]
researcher = "researcher.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
